name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.EC2_HOST }}"
          test -n "${{ secrets.EC2_SSH_PRIVATE_KEY }}"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "Using host: ${{ secrets.EC2_HOST }}"
          ssh-keyscan -T 30 -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 ubuntu@${{ secrets.EC2_HOST }} "echo SSH connection successful"

      - name: Generate release ID
        id: release
        run: echo "release_id=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Prepare release artifact
        run: |
          cp app/index.html /tmp/index.html
          sed -i "s/DEPLOYMENT_TIMESTAMP/$(date -u '+%Y-%m-%d %H:%M:%S UTC')/g" /tmp/index.html
          sed -i "s/RELEASE_ID/${{ steps.release.outputs.release_id }}/g" /tmp/index.html

      - name: Create release directory on server
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "sudo mkdir -p /var/www/myapp/releases/${{ steps.release.outputs.release_id }} && sudo chown -R ubuntu:ubuntu /var/www/myapp/releases"

      - name: Upload new release
        run: |
          scp /tmp/index.html ubuntu@${{ secrets.EC2_HOST }}:/tmp/index.html
          ssh ubuntu@${{ secrets.EC2_HOST }} "sudo mv /tmp/index.html /var/www/myapp/releases/${{ steps.release.outputs.release_id }}/index.html && sudo chown www-data:www-data /var/www/myapp/releases/${{ steps.release.outputs.release_id }}/index.html"

      - name: Activate release
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "sudo ln -sfn /var/www/myapp/releases/${{ steps.release.outputs.release_id }} /var/www/myapp/current && sudo systemctl reload nginx"

      - name: Health check
        run: |
          curl --fail http://${{ secrets.EC2_HOST }}
